    # --- shop.lkim.me : 정적 SPA -------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name shop.lkim.me;

        ssl_certificate     /Users/lkim/letsencrypt/config/live/shop.lkim.me/fullchain.pem;
        ssl_certificate_key /Users/lkim/letsencrypt/config/live/shop.lkim.me/privkey.pem;

        include /opt/homebrew/etc/nginx/security.conf;

        root /opt/homebrew/var/www/shop;
        index index.html;

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # index.html / sw.js / manifest 는 캐시하지 않는다 (vercel.json 과 같은 규칙)
        location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
        location = /sw.js      { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
        location = /manifest.webmanifest { add_header Cache-Control "no-cache, no-store, must-revalidate"; }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # --- api.shop.lkim.me : 자체 API ---------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name api.shop.lkim.me;

        ssl_certificate     /Users/lkim/letsencrypt/config/live/shop.lkim.me/fullchain.pem;
        ssl_certificate_key /Users/lkim/letsencrypt/config/live/shop.lkim.me/privkey.pem;

        include /opt/homebrew/etc/nginx/security.conf;

        # 이미지 업로드가 base64 로 올라온다. 기본 1m 으로는 모자란다.
        client_max_body_size 12m;

        location / {
            proxy_pass http://127.0.0.1:4310;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
