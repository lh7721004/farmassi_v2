[project]
name = "farmassi-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "asyncpg>=0.30",
    "pyjwt>=2.10",
    "httpx>=0.28",
    "aiosmtplib>=3.0",
    "pywebpush>=2.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
